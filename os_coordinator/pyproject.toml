[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "os-coordinator"
version = "0.1.0-cos"
description = "PID 1 cognitivo del sistema operativo SPEACE OS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Rigene Project"},
]
keywords = ["ai", "speace", "operating-system", "agentic", "init"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
speace-os-coordinator = "os_coordinator.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["os_coordinator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
