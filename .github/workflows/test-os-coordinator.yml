name: test-os-coordinator

# Test del modulo os_coordinator (lo state machine + il wrapper AI + la policy).
# Più rigoroso del test dentro build-distro.yml: aggiunge coverage e matrix
# su più versioni di Python.

on:
  push:
    branches: [main]
    paths:
      - 'os_coordinator/**'
      - '.github/workflows/test-os-coordinator.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: os_coordinator/pyproject.toml

      - name: Install dependencies
        working-directory: os_coordinator
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        working-directory: os_coordinator
        run: |
          python -m pytest src/tests/ -v --tb=short --cov=os_coordinator --cov-report=term-missing --cov-report=xml

      - name: Lint (ruff, se disponibile)
        working-directory: os_coordinator
        run: |
          pip install ruff
          ruff check . || echo "(warn) ruff ha segnalazioni, non blocca"

      - name: Type check (mypy, best effort)
        working-directory: os_coordinator
        run: |
          pip install mypy types-PyYAML
          mypy src/os_coordinator/ --ignore-missing-imports || echo "(warn) mypy ha segnalazioni, non blocca"

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: os_coordinator/coverage.xml
          flags: os_coordinator
          fail_ci_if_error: false
