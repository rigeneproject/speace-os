# Caricato dal supervisore e da os_coordinator all'avvio.

# Backend LLM
export OLLAMA_API_KEY="${OLLAMA_API_KEY:-7310e98b57c04c65ad300627292d0d44.9nO4lREeOHUYivsVkPtZd8le}"
export OLLAMA_ENDPOINT="${OLLAMA_ENDPOINT:-https://ollama.com}"
