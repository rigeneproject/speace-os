#!/bin/sh
# SPEACE OS - variabili d'ambiente per l'agentic AI e i servizi cognitivi.
# Caricato dal supervisore e da os_coordinator all'avvio.

# Backend LLM
# IMPORTANTE: la API key NON deve essere committata. Settarla in fase di build
# tramite secrets manager / variabile CI, es.:
#   export OLLAMA_API_KEY=$(cat /run/secrets/ollama_api_key)
# In mancanza il coordinatore parte in modalita offline (--offline) e usa il
# fallback modello locale se disponibile.
export OLLAMA_API_KEY="${OLLAMA_API_KEY:-}"
export OLLAMA_ENDPOINT="${OLLAMA_ENDPOINT:-https://ollama.com}"
export OLLAMA_MODEL="${OLLAMA_MODEL:-minimax-m3:cloud}"

# Modalita operativa: se OLLAMA_API_KEY e vuota, forza offline
if [ -z "${OLLAMA_API_KEY}" ]; then
    export SPEACE_OFFLINE=1
fi

# Percorsi installazione
export SPEACE_HOME="/opt/speace"
export SPEACE_CELLULAR="${SPEACE_HOME}/cellular_speace"
export SPEACE_PYTHON="${SPEACE_HOME}/.venv/bin/python"

# State / log
export SPEACE_STATE_DIR="/var/lib/speace"
export SPEACE_LOG_DIR="/var/log/speace"
export PYTHONUNBUFFERED=1